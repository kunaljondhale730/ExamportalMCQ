<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login · Exam Portal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: #eef2f7; padding: 2rem 1rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card { background: white; border-radius: 1rem; padding: 2.5rem; box-shadow: 0 6px 18px rgba(0,0,0,0.06); width: 100%; max-width: 400px; text-align: center; }
  h2 { color: #0b2b4f; margin-bottom: 0.5rem; }
  p { color: #617e9e; margin-bottom: 1.5rem; font-size: 0.9rem; }
  input { width: 100%; padding: 0.8rem 1rem; margin-bottom: 1rem; border-radius: 0.8rem; border: 1px solid #dde7f0; font-size: 1rem; }
  .btn { background: #1a6dff; color: white; border: none; padding: 0.9rem; border-radius: 2rem; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 1rem; transition: 0.2s; }
  .btn:hover { background: #0a4ecf; }
  .error { color: #d33b3b; background: #fde8e8; padding: 0.6rem; border-radius: 0.8rem; margin-bottom: 1rem; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="card">
  <h2>🔐 Portal Login</h2>
  <p>Enter your credentials to access the system</p>
  
  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="{{ url_for('login') }}">
    <input type="text" name="username" placeholder="Username / Employee ID" required autofocus>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit" class="btn">Login →</button>
  </form>
</div>
</body>
</html>
